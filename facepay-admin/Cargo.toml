[package]
name = "facepay-admin"
version = "0.1.0"
edition = "2021"
description = "SuiCash host PC admin GUI: standalone app for operating the facepay payment terminal daemon"

[[bin]]
name = "facepay-admin"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
tungstenite = "0.24"
url = "2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
