server {
    listen 1919;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 存在しないパスは index.html へ
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
