server {
    listen 1919;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets get long-term caching
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
