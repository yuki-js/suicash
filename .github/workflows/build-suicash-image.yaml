name: build-suicash-image

on:
  push:
    branches: [main]
    paths:
      - "devpod/Dockerfile"
      - ".github/workflows/build-suicash-image.yaml"
  pull_request:
    paths:
      - "devpod/Dockerfile"
      - ".github/workflows/build-suicash-image.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yuki-js/suicash

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: devpod
          file: devpod/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref_name == 'main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
