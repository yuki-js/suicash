name: Deploy regist-web (self-hosted)

# When changes to regist-web are pushed to face-regist, build on the
# self-hosted runner on the Kali server and restart the serving service.
on:
  push:
    branches: [face-regist]
    paths:
      - "regist-web/**"
      - ".github/workflows/deploy-regist-web.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-regist-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, suicash]
    defaults:
      run:
        working-directory: regist-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        # To bake the treasury key or RPC/faucet in at build time, pass them here
        # (from GitHub Secrets/Variables). Otherwise they can be injected at runtime via URL/localStorage.
        env:
          VITE_TREASURY_SECRET: ${{ secrets.VITE_TREASURY_SECRET }}
          VITE_SUI_RPC: ${{ vars.VITE_SUI_RPC }}
          VITE_SUI_FAUCET: ${{ vars.VITE_SUI_FAUCET }}
        run: npm run build

      - name: Restart service
        # Restart the serving service. Grant the runner user this sudoers entry:
        #   <runner-user> ALL=(root) NOPASSWD: /usr/bin/systemctl restart suicash-regist-web
        run: sudo systemctl restart suicash-regist-web
