name: Deploy regist-web to GitHub Pages

# When regist-web/** on main is pushed (or merged), Actions builds and
# publishes it to GitHub Pages (served over HTTPS, so camera OCR works).
# main is the default branch, so the github-pages environment's default policy
# allows it and we can deploy without touching environment branch protection.
# Public URL: https://yuki-js.github.io/suicash/
on:
  push:
    branches: [main]
    paths:
      - "regist-web/**"
      - ".github/workflows/pages-regist-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy (queue instead of cancelling in-progress runs)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regist-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: regist-web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build
        # The top-up treasury key and RPC/faucet can be baked in at build time
        # (GitHub -> Settings -> Secrets and variables -> Actions).
        # Otherwise they can be injected at runtime via URL query (?treasury=/?rpc=/?faucet=).
        env:
          VITE_TREASURY_SECRET: ${{ secrets.VITE_TREASURY_SECRET }}
          VITE_SUI_RPC: ${{ vars.VITE_SUI_RPC }}
          VITE_SUI_FAUCET: ${{ vars.VITE_SUI_FAUCET }}
        run: npm run build

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: regist-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
