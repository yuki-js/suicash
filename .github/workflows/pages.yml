name: Deploy site + regist-web to GitHub Pages

# When site/** or regist-web/** on main is pushed (or merged), Actions bundles
# them into one artifact and publishes it to GitHub Pages (served over HTTPS, so camera OCR works).
#   /      … site/ (landing page; static HTML, no build step)
#   /app/  … regist-web/dist (registration site)
# main is the default branch, so the github-pages environment's default policy
# allows it and we can deploy without touching environment branch protection.
# Public URL: https://yuki-js.github.io/suicash/ (registration site at …/suicash/app/)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "regist-web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy (queue instead of cancelling in-progress runs)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regist-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: regist-web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build
        # The top-up treasury key and RPC/faucet can be baked in at build time
        # (GitHub -> Settings -> Secrets and variables -> Actions).
        # Otherwise they can be injected at runtime via URL query (?treasury=/?rpc=/?faucet=).
        env:
          VITE_TREASURY_SECRET: ${{ secrets.VITE_TREASURY_SECRET }}
          VITE_SUI_RPC: ${{ vars.VITE_SUI_RPC }}
          VITE_SUI_FAUCET: ${{ vars.VITE_SUI_FAUCET }}
        run: npm run build

      - name: Assemble site (/ = site, /app/ = regist-web)
        working-directory: .
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -f _site/README.md
          cp -r regist-web/dist _site/app
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
