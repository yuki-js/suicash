# ⚠ Read before deploying.
#
# This manifest is deliberately NOT a copy of ref-impl-of-oracle/manifests/. The
# reference exposes the oracle on a public Ingress with no client
# authentication and no rate limiting. Its own spec (§11) recommends both, and
# §7.1.1/§10.1 admit the attestation is forgeable. Shipping that combination
# unchanged would put a forgeable, unauthenticated, CPU-amplifying service on a
# public hostname.
#
# What differs from the reference, and why:
#
#   * No Ingress, and no Service of any kind. Nothing is reachable from outside
#     the cluster. Expose it deliberately (see the commented Service at the
#     bottom) behind a gateway that does client authentication and rate
#     limiting.
#   * NetworkPolicy: deny all ingress, and egress only to DNS. The oracle needs
#     no outbound network at all — it makes no chain calls.
#   * Digest-pinned image, not a mutable tag.
#   * The proving key is mounted from a Secret, not baked into the image, so it
#     can be rotated without a rebuild.
#   * Master keys are mounted as a file, not an env var. An env var is visible
#     in `kubectl describe pod`, in /proc/1/environ, and in most APM agents.
#   * readOnlyRootFilesystem, seccompProfile, dropped capabilities,
#     no service-account token automount.
#   * exec probes that speak real JSON-RPC rather than tcpSocket, which only
#     proves the socket is accepting.
#
# Still missing, and required before any real exposure: a gateway with client
# authentication and rate limiting. `attest` is ~1.2 s of CPU-bound proving per
# call, so it is a denial-of-service amplifier even at one concurrent proof.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: ida-gate
  labels:
    app: ida-gate
    component: oracle
spec:
  # One replica, because one Groth16 prove peaks near 500 MB across ~10 rayon
  # threads. The reference reached the same conclusion.
  #
  # Consequence, stated plainly: a rollout is a hard cut and any node drain
  # takes the service down. There is no PDB because a PDB cannot protect a
  # single replica. Scale-out requires first capping concurrency per pod.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a second pod would double peak memory and
    # both would try to bind.
    type: Recreate
  selector:
    matchLabels:
      app: ida-gate
      component: oracle
  template:
    metadata:
      labels:
        app: ida-gate
        component: oracle
    spec:
      # The container never calls the Kubernetes API. Do not give it a token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oracle
          # Digest-pinned. A mutable tag would let anyone who can push to the
          # registry change what runs here. Substitute the digest from the
          # `image` job in .github/workflows/ci.yml.
          image: ghcr.io/yuki-js/felica-ida-oracle@sha256:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: FELICA_BIND_ADDR
              value: "0.0.0.0:3000"
            - name: FELICA_PROVING_KEY_PATH
              value: /etc/ida-gate/proving-key.bin
            - name: FELICA_KEYS_JSON_FILE
              value: /etc/ida-gate/keys.json
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: keys
              mountPath: /etc/ida-gate
              readOnly: true
            # The image writes nothing; see readOnlyRootFilesystem below.
            - name: tmp
              mountPath: /tmp
          # Measured, not guessed. The reference recorded its own numbers and
          # that was worth doing; these are for the 149k-constraint IDi-level
          # circuit, which is ~15% larger than the reference's 129k.
          #
          #   idle RSS        ~6 MB
          #   one attest      1.2-1.6 s, ~390-500 MB peak, ~750-990% CPU
          #   3 concurrent    peaked ~1.19 GB (bounded at 1 in-process)
          #
          # The limit is sized for ONE in-flight prove plus headroom, which
          # matches MAX_CONCURRENT_PROOFS = 1 in src/api/handler.rs. The
          # semaphore is what makes that limit true; without it this limit is
          # advisory and the pod is OOMKilled.
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1536Mi
              cpu: 2000m
          # Real JSON-RPC, not tcpSocket. A tcpSocket probe passes while a
          # wedged tokio worker or a poisoned key cache serves nothing. The
          # image ships curl precisely so this works.
          startupProbe:
            exec:
              command:
                - /usr/bin/curl
                - -sf
                - -m
                - "3"
                - -X
                - POST
                - http://127.0.0.1:3000
                - -H
                - Content-Type:application/json
                - -d
                - '{"jsonrpc":"2.0","id":1,"method":"ping","params":[]}'
            # Deserializing the 31 MB key happens before the socket binds, so
            # the budget has to cover that. 30 x 5s = 150s.
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /usr/bin/curl
                - -sf
                - -m
                - "3"
                - -X
                - POST
                - http://127.0.0.1:3000
                - -H
                - Content-Type:application/json
                - -d
                - '{"jsonrpc":"2.0","id":1,"method":"ping","params":[]}'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /usr/bin/curl
                - -sf
                - -m
                - "3"
                - -X
                - POST
                - http://127.0.0.1:3000
                - -H
                - Content-Type:application/json
                - -d
                - '{"jsonrpc":"2.0","id":1,"method":"ping","params":[]}'
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # There is no SIGTERM handler in the binary: jsonrpsee's
      # `start(..).stopped()` is awaited without a shutdown signal, so a
      # rollout drops an in-flight 1.2 s proof. This grace period does not fix
      # that — it only bounds how long the kubelet waits before SIGKILL. The
      # fix is a shutdown signal in src/main.rs.
      terminationGracePeriodSeconds: 30
      volumes:
        # Master keys and the ceremony key, as files. Not env vars: an env var
        # is visible in `kubectl describe pod`, in /proc/1/environ, in crash
        # dumps, and in most APM agents.
        #
        # Create with:  kubectl -n ida-gate create secret generic ida-gate-keys \
        #   --from-file=keys.json=keys.json \
        #   --from-file=proving-key.bin=prover/assets/proving_key.bin
        - name: keys
          secret:
            secretName: ida-gate-keys
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
---
# Deny all ingress. The reference had no NetworkPolicy, so every pod in the
# cluster could reach the oracle, and the oracle could reach anything.
#
# The oracle makes no outbound calls at all: no chain RPC, no card network, no
# telemetry. DNS is the single exception, and even that is belt-and-braces for
# future image pulls by a sidecar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oracle-deny-all
  namespace: ida-gate
spec:
  podSelector:
    matchLabels:
      app: ida-gate
      component: oracle
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Intentionally NOT included, and commented out rather than deleted so the
# omission is visible.
#
# 1. An Ingress on a public hostname, as the reference has. That reference has
#    no client authentication and no rate limiting, while its own spec (§11)
#    recommends both. Do not re-add it without a gateway in front.
#
# 2. A plain ClusterIP Service. Add one when something in-cluster needs to call
#    the oracle — e.g. a Sui attestation submitter — and keep it ClusterIP.
#
# ---
