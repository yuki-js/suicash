apiVersion: v1
kind: Namespace
metadata:
  name: ida-gate
  labels:
    app: ida-gate
    # The workload holds FeliCa master keys. Pin the Pod Security Admission
    # level explicitly rather than inheriting whatever the cluster defaults to.
    # The reference manifests left this unlabelled, so the enforced level was
    # whatever happened to be set cluster-wide.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
