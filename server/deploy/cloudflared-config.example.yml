# Example cloudflared (Cloudflare Tunnel) config.
# Install to: /etc/cloudflared/config.yml
#
# Steps (see deploy/README.md):
#   cloudflared tunnel login
#   cloudflared tunnel create felica-oracle      # → <TUNNEL_ID> and credentials json
#   cloudflared tunnel route dns felica-oracle felica-oracle.example.com
#   sudo cloudflared service install              # runs as a service using this file
#
# Replace <TUNNEL_ID> and hostname with your own values.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: felica-oracle.example.com
    service: http://127.0.0.1:3000
    originRequest:
      # attest (proof generation) can take several seconds. Relax origin connect/response waits.
      connectTimeout: 10s
      # Keep the no-response timeout longer than proof time (the Cloudflare edge caps at 100s)
      httpHostHeader: felica-oracle.example.com
  # Everything else: 404
  - service: http_status:404
