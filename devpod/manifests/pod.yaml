apiVersion: v1
kind: Pod
metadata:
  name: suicash
  labels:
    app.kubernetes.io/name: suicash
    app.kubernetes.io/part-of: suicash
spec:
  restartPolicy: Always
  serviceAccountName: suicash
  automountServiceAccountToken: false

  # This Secret is intentionally not committed. Create or copy
  # github-registry-secret in this namespace before starting the pod.
  imagePullSecrets:
    - name: github-registry-secret

  # The container process stays root ONLY so that sshd can bind port 22 and
  # setuid into the unprivileged "user" account for every login session.
  # sshd is configured with "AllowUsers user" and "PermitRootLogin no", so
  # direct root SSH is refused; escalation is via sudo from "user".
  # Do NOT set this to 1000: sshd would no longer be able to bind :22.
  securityContext:
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault

  initContainers:
    - name: prepare-home
      image: ghcr.io/yuki-js/suicash:latest
      # Always pull: the ":latest" tag is rebuilt by CI, so a cached node copy
      # would keep serving the previous image and mask a rollback.
      imagePullPolicy: Always
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          chown 1000:1000 /home/user
          chmod 0700 /home/user
      securityContext:
        runAsUser: 0
        privileged: false
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: home
          mountPath: /home/user

  containers:
    - name: suicash
      image: ghcr.io/yuki-js/suicash:latest
      # Must match the init container: a stale cached ":latest" here would
      # run an old sshd configuration.
      imagePullPolicy: Always

      securityContext:
        runAsUser: 0
        privileged: false
        allowPrivilegeEscalation: false

      ports:
        - name: ssh
          containerPort: 22
          protocol: TCP
        - name: app-1919
          containerPort: 1919
          protocol: TCP
        - name: app-4545
          containerPort: 4545
          protocol: TCP
        - name: app-14514
          containerPort: 14514
          protocol: TCP

      resources:
        requests:
          cpu: 100m
          memory: 2Gi
        limits:
          # RAM is bounded; CPU is intentionally left unlimited for burst use.
          memory: 8Gi

      volumeMounts:
        - name: home
          mountPath: /home/user

  volumes:
    - name: home
      persistentVolumeClaim:
        claimName: suicash-home

  terminationGracePeriodSeconds: 10
