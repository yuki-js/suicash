<svg xmlns="http://www.w3.org/2000/svg" width="172" height="108" viewBox="0 0 172 108" role="img" aria-label="SuiCash カード">
  <title>SuiCash カード</title>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=REM:wght@100..900&display=block');]]></style>
  <defs>
    <linearGradient id="scSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9f8" />
      <stop offset="1" stop-color="#e2e6e4" />
    </linearGradient>
    <linearGradient id="scAqua" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5cb0ff" />
      <stop offset="1" stop-color="#3d95f5" />
    </linearGradient>
    <clipPath id="scCardClip">
      <rect x="0" y="0" width="172" height="108" rx="9" />
    </clipPath>
  </defs>

  <g clip-path="url(#scCardClip)">
    <!-- シルバー下地(交通系カードの地色) -->
    <rect x="0" y="0" width="172" height="108" fill="url(#scSilver)" />

    <!-- 台形パネル(Suica 券面の台形をトレス。色は SuiCash テーマのアクア) -->
    <path d="M 12 7 H 76 Q 80 7 81.2 10.8 L 108.8 98.2 Q 110 102 106 102 H 12 Q 7 102 7 97 V 12 Q 7 7 12 7 Z" fill="url(#scAqua)" />

    <!-- 左上の挿入方向マーク(交通系カードの意匠) -->
    <path d="M 15 2.2 L 10.4 4.3 L 15 6.4 Z" fill="#0a1a2f" opacity="0.7" />

    <!-- 右上の IC マーク(汎用・非ブランド) -->
    <g opacity="0.85">
      <rect x="146" y="8" width="17" height="11" rx="2.2" fill="none" stroke="#0a1a2f" stroke-width="1.1" />
      <text x="154.5" y="16.6" text-anchor="middle" font-family="REM, sans-serif" font-weight="700" font-size="7.2" fill="#0a1a2f">IC</text>
    </g>

    <!-- マスコット(SuiCash オリジナル)。ペンギン位置にらくがき風で -->
    <g transform="translate(122 42) scale(0.34)">
      <!-- 触手あし -->
      <g fill="none" stroke="#0a1a2f" stroke-width="6" stroke-linecap="round">
        <path d="M 34 132 C 32 140 30 145 25 149" />
        <path d="M 50 133 C 50 141 50 146 50 150" />
        <path d="M 66 132 C 68 140 70 145 75 149" />
      </g>
      <!-- ひれ -->
      <g fill="#4DA2FF" stroke="#0a1a2f" stroke-width="6" stroke-linejoin="round">
        <path d="M 15 64 C 3 56 -1 42 6 32 C 13 40 19 52 22 60 Z" />
        <path d="M 85 64 C 97 70 101 84 95 94 C 88 86 82 74 80 68 Z" />
      </g>
      <!-- 胴体 -->
      <path d="M 50 10 C 74 10 88 30 87 60 C 86 84 83 102 79 118 C 76 128 68 132 50 132 C 32 132 24 128 21 118 C 17 102 14 84 13 60 C 12 30 26 10 50 10 Z" fill="#4DA2FF" stroke="#0a1a2f" stroke-width="6" stroke-linejoin="round" />
      <!-- おなか -->
      <path d="M 50 56 C 65 56 73 72 72 92 C 71 110 63 120 50 120 C 37 120 29 110 28 92 C 27 72 35 56 50 56 Z" fill="#ffffff" />
      <!-- かお -->
      <circle cx="37" cy="40" r="5.5" fill="#0a1a2f" />
      <circle cx="63" cy="40" r="5.5" fill="#0a1a2f" />
      <circle cx="38.5" cy="38.5" r="2" fill="#ffffff" />
      <circle cx="64.5" cy="38.5" r="2" fill="#ffffff" />
      <path d="M 45 48 L 55 48 L 50 56 Z" fill="#0a1a2f" />
      <path d="M 32 64 C 40 71 60 71 68 64" fill="none" stroke="#0a1a2f" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- ワードマーク: 台形パネル内の左下に白で(iC はアウトライン=Suica の ic と同じ処理) -->
    <text x="12" y="94" font-family="REM, sans-serif" font-weight="605" font-size="22" font-kerning="none" style="font-variation-settings:'wght' 605;font-variant-ligatures:none"><tspan fill="#ffffff">Su</tspan><tspan fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="miter">iC</tspan><tspan fill="#ffffff">ash</tspan></text>
  </g>

  <rect x="0.75" y="0.75" width="170.5" height="106.5" rx="8.5" fill="none" stroke="rgba(10, 26, 47, 0.28)" stroke-width="1.5" />
</svg>
