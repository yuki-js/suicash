<svg xmlns="http://www.w3.org/2000/svg" width="172" height="108" viewBox="0 0 172 108" role="img" aria-label="SuiCash card">
  <title>SuiCash card</title>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=REM:wght@100..900&display=block');]]></style>
  <defs>
    <linearGradient id="scGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40c23b" />
      <stop offset="1" stop-color="#2f9e2f" />
    </linearGradient>
    <linearGradient id="scAqua" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5cb0ff" />
      <stop offset="1" stop-color="#3d95f5" />
    </linearGradient>
    <clipPath id="scCardClip">
      <rect x="0" y="0" width="172" height="108" rx="9" />
    </clipPath>
  </defs>

  <g clip-path="url(#scCardClip)">
    <!-- Green background (transit-card style) -->
    <rect x="0" y="0" width="172" height="108" fill="url(#scGreen)" />

    <!-- Left trapezoid panel (SuiCash theme aqua) -->
    <polygon points="0,0 98,0 66,108 0,108" fill="url(#scAqua)" />

    <!-- Top-right IC mark (generic, unbranded) -->
    <g opacity="0.9">
      <rect x="146" y="9" width="17" height="11" rx="2.2" fill="none" stroke="#ffffff" stroke-width="1.1" />
      <text x="154.5" y="17.6" text-anchor="middle" font-family="REM, sans-serif" font-weight="700" font-size="7.2" fill="#ffffff">IC</text>
    </g>

    <!-- White backing plate behind the mascot (so it doesn't blend into the green) -->
    <ellipse cx="136" cy="74" rx="31" ry="33" fill="#ffffff" opacity="0.92" />

    <!-- Mascot (SuiCash original), placed bottom right where the penguin would be -->
    <g transform="translate(103.4 37.5) scale(0.131)">
      <g fill="none" stroke-linecap="round">
        <path d="M198 206 C180 150 162 92 158 46" stroke="#0A1A2F" stroke-width="78" />
        <path d="M318 204 C340 164 366 130 396 112" stroke="#0A1A2F" stroke-width="62" />
        <path d="M198 206 C180 150 162 92 158 46" stroke="#4DA2FF" stroke-width="64" />
        <path d="M318 204 C340 164 366 130 396 112" stroke="#4DA2FF" stroke-width="48" />
      </g>
      <g fill="none" stroke-linecap="round">
        <path d="M148 330 C142 382 138 414 137 442" stroke="#0A1A2F" stroke-width="50" />
        <path d="M222 330 C219 372 216 404 215 428" stroke="#0A1A2F" stroke-width="44" />
        <path d="M296 330 C300 368 302 398 303 418" stroke="#0A1A2F" stroke-width="44" />
        <path d="M364 330 C370 382 374 414 375 442" stroke="#0A1A2F" stroke-width="50" />
        <path d="M137 438 L104 482 M137 438 L137 492 M137 438 L170 482" stroke="#0A1A2F" stroke-width="36" />
        <path d="M375 438 L342 482 M375 438 L375 492 M375 438 L408 482" stroke="#0A1A2F" stroke-width="36" />
        <path d="M148 330 C142 382 138 414 137 442" stroke="#4DA2FF" stroke-width="38" />
        <path d="M222 330 C219 372 216 404 215 428" stroke="#4DA2FF" stroke-width="32" />
        <path d="M296 330 C300 368 302 398 303 418" stroke="#4DA2FF" stroke-width="32" />
        <path d="M364 330 C370 382 374 414 375 442" stroke="#4DA2FF" stroke-width="38" />
        <path d="M137 438 L104 482 M137 438 L137 492 M137 438 L170 482" stroke="#4DA2FF" stroke-width="24" />
        <path d="M375 438 L342 482 M375 438 L375 492 M375 438 L408 482" stroke="#4DA2FF" stroke-width="24" />
      </g>
      <g stroke="#0A1A2F" stroke-width="10" stroke-linejoin="round">
        <path fill="#4DA2FF" d="M272 124 C358 128 424 174 432 246 C438 304 402 348 342 366 C276 386 134 392 100 354 C66 316 78 256 108 214 C144 164 202 122 272 124 Z" />
        <path fill="#FFFFFF" d="M236 250 C284 248 312 270 314 302 C316 334 294 356 252 360 C208 364 174 348 170 318 C166 286 190 252 236 250 Z" />
      </g>
      <g>
        <circle cx="215" cy="292" r="9.5" fill="#0A1A2F" />
        <circle cx="263" cy="288" r="8" fill="#0A1A2F" />
        <circle cx="218" cy="289" r="3.2" fill="#FFFFFF" />
        <circle cx="266" cy="285" r="2.7" fill="#FFFFFF" />
        <path d="M239 297 L251 313 L227 313 Z" fill="#0A1A2F" />
        <path d="M176 322 C202 372 290 368 312 316 C288 346 198 350 176 322 Z" fill="#0A1A2F" />
        <path d="M228 348 C238 364 258 362 266 346 Z" fill="#8FD6E8" />
      </g>
    </g>

    <!-- Wordmark: large, white, bottom left (iC in navy accent) -->
    <text x="11" y="95" font-family="REM, sans-serif" font-weight="605" font-size="27" font-kerning="none" style="font-variation-settings:'wght' 605;font-variant-ligatures:none"><tspan fill="#ffffff" stroke="#0a1a2f" stroke-width="0.7" stroke-linejoin="miter">Su</tspan><tspan fill="#0a1a2f" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="miter">iC</tspan><tspan fill="#ffffff" stroke="#0a1a2f" stroke-width="0.7" stroke-linejoin="miter">ash</tspan></text>
  </g>

  <rect x="0.75" y="0.75" width="170.5" height="106.5" rx="8.5" fill="none" stroke="rgba(10, 26, 47, 0.28)" stroke-width="1.5" />
</svg>
