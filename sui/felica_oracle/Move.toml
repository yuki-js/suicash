[package]
name = "felica_oracle"
edition = "2024"
license = "MIT"

[dependencies]
# Sui, MoveStdlib and friends are added implicitly by the Sui CLI; declaring
# them here breaks dependency resolution (the repo root is not a package).

# OpenZeppelin Contracts for Sui — access control (RBAC + Auth witnesses).
# Pinned to an audited release; the MVR slug (@openzeppelin-move/access) is the
# preferred install, but this environment has no `mvr` resolver, so pin via git.
# See README "Dependencies" for the MVR equivalent and audit scope.
openzeppelin_access = { git = "https://github.com/OpenZeppelin/contracts-sui.git", subdir = "contracts/access", rev = "v1.5.1" }
