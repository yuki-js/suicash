[package]
name = "facepay-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "facepay-host"
path = "src/main.rs"

[dependencies]
felica = { version = "1.0.3", features = ["usb"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tungstenite = "0.24"
